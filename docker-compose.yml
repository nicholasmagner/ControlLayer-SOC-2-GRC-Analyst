version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: controllayer-db
    restart: always
    environment:
      POSTGRES_USER: controllayer
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: controllayer
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
